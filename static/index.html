<!DOCTYPE html>
<html>
<head>
    <title>CDDA Meeting Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #0B1D3A, #1E4EBC); color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .status { background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #0B1D3A; }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="header">
        <h1>CDDA Meeting Manager</h1>
        <p>Powered by Microsoft Fabric Lakehouse</p>
    </div>
    <div class="container">
        <div class="status">
            <h2>System Status</h2>
            <p id="status">Connecting to backend...</p>
        </div>
    </div>
    <script>
        fetch('/api/health').then(r => r.json()).then(d => {
            document.getElementById('status').textContent = d.message + ' ✓';
        }).catch(e => {
            document.getElementById('status').textContent = 'Error: ' + e.message;
        });
    </script>
</body>
</html>
